name: Release

# Push a tag such as v0.1.0 to build every platform and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low so the binary runs on older distros
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   name: windows-x86_64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,     name: macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,      name: macos-x86_64 }
    env:
      PKG: ghillieclip-${{ github.ref_name }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir "$PKG"
          cp target/${{ matrix.target }}/release/ghillieclip README.md LICENSE assets/DejaVu-LICENSE.txt \
             packaging/linux/ghillieclip.desktop packaging/linux/install.sh "$PKG/"
          cp assets/icon-256.png "$PKG/ghillieclip.png"
          tar czf "$PKG.tar.gz" "$PKG"
          sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256"

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="$PKG/GhillieClip.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/${{ matrix.target }}/release/ghillieclip "$app/MacOS/"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Info.plist"
          iconset=GhillieClip.iconset
          mkdir "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-1024.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon-1024.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Resources/GhillieClip.icns"
          # Ad-hoc signature: required for arm64 binaries to launch at all (not notarised).
          codesign --force --deep --sign - "$PKG/GhillieClip.app"
          cp README.md LICENSE assets/DejaVu-LICENSE.txt "$PKG/"
          ditto -c -k --keepParent "$PKG" "$PKG.zip"
          shasum -a 256 "$PKG.zip" > "$PKG.zip.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:PKG | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ghillieclip.exe", README.md, LICENSE, assets/DejaVu-LICENSE.txt $env:PKG
          Compress-Archive -Path $env:PKG -DestinationPath "$env:PKG.zip"
          $hash = (Get-FileHash "$env:PKG.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:PKG.zip" | Out-File -Encoding ascii "$env:PKG.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ghillieclip-*.tar.gz*
            ghillieclip-*.zip*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
